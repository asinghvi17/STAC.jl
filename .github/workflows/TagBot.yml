# Tags a release and writes its changelog once the package's registration merges in General.
# TagBot comments on the registry pull request; the `workflow_dispatch` half is for tagging a
# release whose comment was missed.
name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        description: How many days back to look for registrations
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  discussions: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The same key the docs job deploys with, so a tag also builds versioned docs.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
